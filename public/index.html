<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Fuga da Ilha</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background: #111; }
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .card { background: #222; padding: 20px; border-radius: 8px; border: 2px solid #555; text-align: center; }
        input, select, button { margin: 10px; padding: 10px 15px; font-size: 16px; background: #333; color: #fff; border: 1px solid #777; cursor: pointer; }
        button:hover { background: #555; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 18px; pointer-events: none; z-index: 5; text-shadow: 2px 2px #000; }
        #death-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(150,0,0,0.6); color: white; text-align: center; font-size: 32px; font-weight: bold; justify-content: center; align-items: center; z-index: 9; }
    </style>
    <!-- Three.js para renderização 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
    <div id="status">Missões Concluídas: 0/3</div>
    <div id="spectate-notice" style="display:none; color: yellow;">MODO ESPECTADOR</div>
</div>

<div id="death-screen">
    VOCÊ FOI DEVOORADO PELO TUBARÃO!<br>
    <span style="font-size:18px;">Aguarde ou especte os outros sobreviventes...</span>
</div>

<div id="menu">
    <div class="card">
        <h1>FUGA DA ILHA</h1>
        <label>Seu Nome:</label><br>
        <input type="text" id="username" value="Jogador1"><br>
        <label>Cor da Roupa:</label><br>
        <select id="charColor">
            <option value="0xff6600">Laranja (Original)</option>
            <option value="0x0066ff">Azul</option>
            <option value="0x33cc33">Verde</option>
            <option value="0xcc0000">Vermelho</option>
            <option value="0x9900cc">Roxo</option>
        </select><br>
        <button onclick="startGame()">ENTRAR NA ILHA</button>
    </div>
</div>

<script>
let scene, camera, renderer, ws;
let myId, myMesh, epsteinMesh, swatMesh;
let otherPlayers = {};
let keys = {};
let isAlive = true;
let puzzles = [];
let islandRadius = 45; // Limite da água

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3399ff); // Céu/Água
    scene.fog = new THREE.FogExp2(0x3399ff, 0.015);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Iluminação
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(50, 100, 50);
    light.castShadow = true;
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x666666));

    // Mar
    const seaGeo = new THREE.PlaneGeometry(300, 300);
    const seaMat = new THREE.MeshLambertMaterial({ color: 0x004488 });
    const sea = new THREE.Mesh(seaGeo, seaMat);
    sea.rotation.x = -Math.PI / 2;
    sea.position.y = -0.5;
    scene.add(sea);

    // Terreno da Ilha
    const islandGeo = new THREE.CylinderGeometry(islandRadius, islandRadius + 5, 2, 32);
    const islandMat = new THREE.MeshLambertMaterial({ color: 0x228b22 });
    const island = new THREE.Mesh(islandGeo, islandMat);
    island.position.y = -0.5;
    scene.add(island);

    // Bot Epstein (Inimigo)
    epsteinMesh = createCharacter(0x333333, "EPSTEIN");
    scene.add(epsteinMesh);

    // Criar Puzzles
    createPuzzle(10, 10);
    createPuzzle(-15, 20);
    createPuzzle(20, -15);

    animate();
}

function createCharacter(hexColor, labelText) {
    const group = new THREE.Group();

    // Tronco
    const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.4);
    const bodyMat = new THREE.MeshLambertMaterial({ color: hexColor });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    group.add(body);

    // Cabeça
    const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
    const headMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.1;
    group.add(head);

    // Pernas (Separadas para balançar)
    const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
    const legMat = new THREE.MeshLambertMaterial({ color: 0x555555 });

    group.leftLeg = new THREE.Mesh(legGeo, legMat);
    group.leftLeg.position.set(-0.2, 0.4, 0);
    group.add(group.leftLeg);

    group.rightLeg = new THREE.Mesh(legGeo, legMat);
    group.rightLeg.position.set(0.2, 0.4, 0);
    group.add(group.rightLeg);

    return group;
}

function createPuzzle(x, z) {
    const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const mat = new THREE.MeshLambertMaterial({ color: 0xffff00 });
    const box = new THREE.Mesh(geo, mat);
    box.position.set(x, 0.75, z);
    scene.add(box);
    puzzles.push({ mesh: box, done: false, x, z });
}

function startGame() {
    document.getElementById('menu').style.display = 'none';
    init3D();

    const name = document.getElementById('username').value;
    const color = parseInt(document.getElementById('charColor').value);

    // Conectar ao mesmo servidor (pela rede local)
    ws = new WebSocket(`ws://${location.host}`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', name, color }));
    };

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === 'init') {
            myId = data.id;
            myMesh = createCharacter(color, name);
            scene.add(myMesh);
        }

        if (data.type === 'playerJoined') {
            if (data.player.id !== myId) {
                otherPlayers[data.player.id] = createCharacter(data.player.color, data.player.name);
                scene.add(otherPlayers[data.player.id]);
            }
        }

        if (data.type === 'playerMoved') {
            if (data.id !== myId && otherPlayers[data.id]) {
                otherPlayers[data.id].position.set(data.x, data.y, data.z);
            }
        }

        if (data.type === 'epsteinMoved') {
            epsteinMesh.position.set(data.x, 1, data.z);
        }

        if (data.type === 'puzzleUpdate') {
            document.getElementById('status').innerText = `Missões Concluídas: ${data.count}/3`;
        }

        if (data.type === 'swatArrived') {
            document.getElementById('status').innerText = "RESGATE CHEGOU! Vá para o centro da Ilha!";
            // Cria helicóptero no centro
            const swatGeo = new THREE.BoxGeometry(4, 3, 6);
            const swatMat = new THREE.MeshLambertMaterial({ color: 0x000000 });
            swatMesh = new THREE.Mesh(swatGeo, swatMat);
            swatMesh.position.set(0, 1.5, 0);
            scene.add(swatMesh);
        }
    };

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
}

function triggerSharkCutscene() {
    isAlive = false;
    document.getElementById('death-screen').style.display = 'flex';
    ws.send(JSON.stringify({ type: 'died' }));

    // Animação simples do Tubarão surgindo
    const sharkGeo = new THREE.ConeGeometry(2, 4, 8);
    const sharkMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const shark = new THREE.Mesh(sharkGeo, sharkMat);
    shark.position.set(myMesh.position.x, -2, myMesh.position.z);
    scene.add(shark);

    let frame = 0;
    const interval = setInterval(() => {
        frame++;
        shark.position.y += 0.2;
        if (frame > 20) {
            clearInterval(interval);
            scene.remove(myMesh);
            scene.remove(shark);
            document.getElementById('spectate-notice').style.display = 'block';
        }
    }, 50);
}

let stepAnim = 0;

function animate() {
    requestAnimationFrame(animate);

    if (myMesh && isAlive) {
        let moveX = 0, moveZ = 0;

        if (keys['w'] || keys['arrowup']) moveZ -= 0.2;
        if (keys['s'] || keys['arrowdown']) moveZ += 0.2;
        if (keys['a'] || keys['arrowleft']) moveX -= 0.2;
        if (keys['d'] || keys['arrowright']) moveX += 0.2;

        if (moveX !== 0 || moveZ !== 0) {
            myMesh.position.x += moveX;
            myMesh.position.z += moveZ;

            // Animação de caminhada ("Balançadinha")
            stepAnim += 0.2;
            myMesh.leftLeg.rotation.x = Math.sin(stepAnim);
            myMesh.rightLeg.rotation.x = -Math.sin(stepAnim);
            myMesh.rotation.y = Math.atan2(moveX, moveZ);

            ws.send(JSON.stringify({
                type: 'move',
                x: myMesh.position.x,
                y: myMesh.position.y,
                z: myMesh.position.z
            }));
        }

        // Checa se caiu na água (fora do raio da ilha)
        const distFromCenter = Math.sqrt(myMesh.position.x ** 2 + myMesh.position.z ** 2);
        if (distFromCenter > islandRadius) {
            triggerSharkCutscene();
        }

        // Checa interação com os Puzzles (apertar Espaço perto)
        puzzles.forEach(p => {
            if (!p.done) {
                const d = Math.sqrt((myMesh.position.x - p.x)**2 + (myMesh.position.z - p.z)**2);
                if (d < 2 && keys[' ']) {
                    p.done = true;
                    p.mesh.material.color.setHex(0x00ff00); // Verde ao completar
                    ws.send(JSON.stringify({ type: 'puzzleDone' }));
                }
            }
        });

        // Câmera segue o jogador local
        camera.position.set(myMesh.position.x, myMesh.position.y + 12, myMesh.position.z + 15);
        camera.lookAt(myMesh.position);
    } else if (!isAlive) {
        // Câmera de espectador foca no Epstein ou centro
        camera.position.set(epsteinMesh.position.x, epsteinMesh.position.y + 15, epsteinMesh.position.z + 15);
        camera.lookAt(epsteinMesh.position);
    }

    renderer.render(scene, camera);
}
</script>
</body>
</html>
